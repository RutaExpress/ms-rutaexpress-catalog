server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-rutaexpress-catalog
  # Oracle: usuario CATALOG_USER en ORCLPDB1 (lo crea apps/oracle/01-usuarios.sh de rutaexpress-infra)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:CATALOG_USER}
    # secreto: sin valor por defecto (convención); va en el .env
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
